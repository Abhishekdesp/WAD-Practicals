<!DOCTYPE html>
<html>
<head>
    <title>Facebook Clone</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f0f2f5;
        }
        .top-bar {
            background: #3b5998;
            color: white;
            padding: 10px;
        }
        .signup-box {
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<!-- ✅ Top Navbar -->
<div class="top-bar d-flex justify-content-between align-items-center px-4">
    <h2>facebook</h2>

    <div class="d-flex">
        <input class="form-control me-2" placeholder="Email">
        <input class="form-control me-2" type="password" placeholder="Password">
        <button class="btn btn-light">Login</button>
    </div>
</div>

<!-- ✅ Main Section -->
<div class="container mt-5">
    <div class="row">

        <!-- Left Side -->
        <div class="col-md-6">
            <h4>Facebook is useless without friends.</h4>
            <p>Make More Friends.</p>
            <img src="https://via.placeholder.com/400" class="img-fluid">
        </div>

        <!-- Right Side (Signup Form) -->
        <div class="col-md-6">
            <div class="signup-box">

                <h3>Create an Account</h3>
                <p>It's free and always will be.</p>

                <div class="row">
                    <div class="col">
                        <input class="form-control mb-2" placeholder="First name">
                    </div>
                    <div class="col">
                        <input class="form-control mb-2" placeholder="Last name">
                    </div>
                </div>

                <input class="form-control mb-2" placeholder="Email">
                <input class="form-control mb-2" placeholder="Re-enter email">
                <input class="form-control mb-2" type="password" placeholder="Password">

                <input class="form-control mb-2" type="date">

                <div class="mb-2">
                    <input type="radio"> Male
                    <input type="radio"> Female
                </div>

                <button class="btn btn-success w-100">Sign Up</button>

            </div>
        </div>

    </div>
</div>

</body>
</html>
