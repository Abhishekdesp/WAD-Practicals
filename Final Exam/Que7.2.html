<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: aliceblue;
        }

        .navbar{
            background: blue;
            color: white;
            padding: 10px;
        }

        .signup{
            background: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    
    <div class="navbar d-flex justify-content-between">
        <h2>Facebook</h2>
        <div class="d-flex">
            <input type="text" placeholder="email" class="form-control me-2">
            <input type="text" placeholder="password" class="form-control me-2">
            <button class="btn btn-primary">Login</button>
        </div>
    </div>
    <div class="container mt-5">
        <div class="row">

            <div class="col-md-6">
                <h4>FaceBook is useless without friends</h4>
                <h4>Make more friends</h4>
            </div>

            <div class="col-md-6 signup p-4">
                <h4>Create an Account</h4>
                <p>It's free and will always be free</p>

                <div class="row">
                    <div class="col">
                        <input type="text" class="form-control mb-2" placeholder="Enter FirstName">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control mb-2" placeholder="Enter LastName">
                    </div>
                </div>
                <input type="text" class="form-control mb-2" placeholder="Enter Mail">
                <input type="text" class="form-control mb-2" placeholder="Re-enter mail">
                <input type="text" class="form-control mb-2" placeholder="password">
                <input type="date" class="form-control mb-2" placeholder="enter date">
                <input type="radio" >Male
                <input type="radio">Female
                <br>
                <button class="btn btn-primary w-100">Sign Up</button>
            </div>
        </div>
    </div>
    
</body>
</html>
