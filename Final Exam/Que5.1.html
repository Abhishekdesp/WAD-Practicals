<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container">
        <h2 class="text-center">Product Listing</h2>
        
        <div class="text-center">
            <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Filter By</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item"  onclick="filter('all')">All</a></li>
                <li><a class="dropdown-item" onclick="filter('electronics')">Electronics</a></li>
                <li><a class="dropdown-item" onclick="filter('clothing')">Clothing</a></li>
            </ul>
        </div>

        <div class="row" id="products">

            <div class="col-md-4 product electronics">
                <div class="card">
                    <img src="headphones.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5>Headphones</h5>
                        <p>₹7999</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 product clothing">
                <div class="card">
                    <img src="headphones.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5>Clothing Brand</h5>
                        <p>₹4999</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 product electronics">
                <div class="card">
                    <img src="headphones.jpeg" class="card-img-top">
                    <div class="card-body">
                    <h5>Smart Phone</h5>
                    <p>₹99,999</p>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function filter(category)
        {
            let items=document.getElementsByClassName("product");

            for(let i=0;i<items.length;i++)
            {
                if(category=='all' || items[i].classList.contains(category))
                {
                    items[i].style.display="block"
                }
                else
                {
                    items[i].style.display="none";
                }
            }
        }
    </script>
</body>
</html>
