<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list"></ul>

    <script>
        fetch("http://localhost:3000/users")
        .then(res=>res.json())
        .then(data=>{
            let list=document.getElementById("list");

            data.forEach(u=>{
                list.innerHTML+=`<li>${u.name}-${u.email}</li>`;
            });
        });
    </script>
</body>
</html>
