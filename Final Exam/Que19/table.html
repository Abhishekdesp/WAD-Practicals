<!DOCTYPE html>
<html>

<body>

    <h2>Student Marks</h2>

    <table border="1" id="table">
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>WAD</th>
            <th>DSBDA</th>
            <th>CNS</th>
            <th>CC</th>
            <th>AI</th>
        </tr>
    </table>

    <script>
        fetch('http://localhost:3000/data')
            .then(res => res.json())
            .then(data => {
                let t = document.getElementById("table");
                data.forEach(s => {
                    t.innerHTML += `
    <tr>
      <td>${s.name}</td>
      <td>${s.roll_no}</td>
      <td>${s.WAD_Marks}</td>
      <td>${s.DSBDA_Marks}</td>
      <td>${s.CNS_Marks}</td>
      <td>${s.CC_Marks}</td>
      <td>${s.AI_Marks}</td>
    </tr>`;
                });
            });
    </script>

</body>

</html>
