<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Song Details</h2>

    <table border="1" id="table">
        <tr>
            <th>Song</th>
            <th>Film</th>
            <th>Director</th>
            <th>Singer</th>
            <th>Actor</th>
            <th>Actress</th>
        </tr>
    </table>

    <script>
        fetch('http://localhost:3000')
        .then(res=>res.json())
        .then(data=>{
            let table=document.getElementById("table");

            data.forEach(s=>{
                table.innerHTML+=`<tr>
                                    <td>${s.songname}</td>
                                    <td>${s.film}</td>
                                    <td>${s.director}</td>
                                    <td>${s.singer}</td>
                                    <td>${s.actor}</td>
                                    <td>${s.actress}</td>
                                  </tr>`;
            });
        });
    </script>
</body>
</html>
