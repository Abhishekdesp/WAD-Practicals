<!DOCTYPE html>
<html>
<head>
<title>Event Form</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
<h3 class="text-center">Event Registration</h3>

<form class="needs-validation" novalidate>

<!-- Name -->
<div class="form-floating mb-3">
  <input type="text" class="form-control" placeholder="Name" required>
  <label>Full Name</label>
  <div class="invalid-feedback">Enter name</div>
</div>

<!-- Email -->
<div class="form-floating mb-3">
  <input type="email" class="form-control" placeholder="Email" required>
  <label>Email</label>
  <div class="invalid-feedback">Enter valid email</div>
</div>

<!-- Phone -->
        <div class="form-floating mb-3">
            <input type="tel" class="form-control" id="phone" placeholder="Phone" required>
            <label for="phone">Phone Number</label>
            <div class="invalid-feedback">Enter phone number</div>
        </div>

<!-- Event -->
<div class="mb-3">
  <label>Event Type</label>
  <select class="form-select" required data-bs-toggle="tooltip" title="Select event">
    <option value="">Choose</option>
    <option>Workshop</option>
    <option>Seminar</option>
  </select>
  <div class="invalid-feedback">Select event</div>
</div>

<!-- Button -->
<button class="btn btn-primary w-100">Register</button>

</form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Validation
document.getElementById("form").onsubmit = function(e) {
  if (!this.checkValidity()) {
    e.preventDefault();
    alert("Please fill all fields correctly");
  }
};

// Tooltip
document.querySelectorAll('[data-bs-toggle="tooltip"]')
.forEach(el => new bootstrap.Tooltip(el));
</script>

</body>
</html>
