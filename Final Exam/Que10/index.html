<!DOCTYPE html>
<html>
<body>

<h2>To-Do List</h2>

<input id="task" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="list"></ul>

<script>

// Load tasks
function loadTasks() {
  fetch("http://localhost:3000")
    .then(res => res.json())
    .then(data => {
      let list = document.getElementById("list");
      list.innerHTML = "";

      data.forEach(t => {
        list.innerHTML += `
          <li>
            ${t.text}
            <button onclick="del(${t.id})">X</button>
            <button onclick="upd(${t.id})">Edit</button>
          </li>`;
      });
    });
}

// Add
function addTask() {
  let text = document.getElementById("task").value;

  fetch("http://localhost:3000", {
    method: "POST",
    body: JSON.stringify({ text })
  }).then(loadTasks);
}

// Delete
function del(id) {
  fetch("http://localhost:3000/" + id, { method: "DELETE" })
    .then(loadTasks);
}

// Update
function upd(id) {
  let text = prompt("New task");

  fetch("http://localhost:3000/" + id, {
    method: "PUT",
    body: JSON.stringify({ text })
  }).then(loadTasks);
}

loadTasks();

</script>

</body>
</html>
