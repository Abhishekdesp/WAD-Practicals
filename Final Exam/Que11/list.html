<!DOCTYPE html>
<html>
<body>

<h2>Registered Users</h2>

<ul id="list"></ul>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];

let list = document.getElementById("list");

users.forEach(u => {
    list.innerHTML += `
        <li>
            ${u.name} - ${u.email} - ${u.mobile}
        </li>
    `;
});

</script>

</body>
</html>
