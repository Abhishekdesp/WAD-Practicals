<!DOCTYPE html>
<html>
<body>

<h2>Register</h2>

<form onsubmit="registerUser(event)">
    <input id="name" placeholder="Name" required><br><br>
    <input id="email" type="email" placeholder="Email" required><br><br>
    <input id="mobile" placeholder="Mobile" required><br><br>
    <input id="dob" type="date" required><br><br>
    <input id="city" placeholder="City" required><br><br>
    <input id="address" placeholder="Address" required><br><br>
    <input id="password" type="password" placeholder="Password" required><br><br>

    <button type="submit">Register</button>
</form>

<script>

function registerUser(e) {
    e.preventDefault();

    let user = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        dob: document.getElementById("dob").value,
        city: document.getElementById("city").value,
        address: document.getElementById("address").value,
        password: document.getElementById("password").value
    };

    // ✅ Validation
    if(user.mobile.length != 10) {
        alert("Mobile must be 10 digits");
        return;
    }

    // Save to localStorage
    let users = JSON.parse(localStorage.getItem("users")) || [];
    users.push(user);
    localStorage.setItem("users", JSON.stringify(users));

    alert("Registered successfully!");

    // simulate AJAX POST
    fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        body: JSON.stringify(user)
    });

    window.location = "login.html";
}

</script>

</body>
</html>
