<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Products</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center">Product Listing</h2>

    <!-- Dropdown Filter -->
    <div class="text-center">
        <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
            Filter Category
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item"  onclick="filter('all')">All</a></li>
            <li><a class="dropdown-item"  onclick="filter('electronics')">Electronics</a></li>
            <li><a class="dropdown-item"  onclick="filter('clothing')">Clothing</a></li>
        </ul>
    </div>

    <!-- Product Grid -->
    <div class="row" id="products">

        <!-- Card 1 -->
        <div class="col-md-4 mb-4 product electronics">
            <div class="card">
                <img src="headphones.jpeg" class="card-img-top" width="50" height="50">
                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>
                    <p class="card-text">₹7999</p>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4 mb-4 product clothing">
            <div class="card">
                <img src="headphones.jpeg" class="card-img-top" width="50" height="50">
                <div class="card-body">
                    <h5 class="card-title">T-Shirt</h5>
                    <p class="card-text">₹999</p>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4 mb-4 product electronics" >
            <div class="card">
                <img src="headphones.jpeg" class="card-img-top" width="50" height="50">
                <div class="card-body">
                    <h5 class="card-title">Smartwatch</h5>
                    <p class="card-text">₹4999</p>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Filter Script -->
<script id="d3h0c9">
function filter(category) {
    let items = document.getElementsByClassName("product");

    for (let i = 0; i < items.length; i++) {
        if (category === "all" || items[i].classList.contains(category)) {
            items[i].style.display = "block";
        } else {
            items[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>
