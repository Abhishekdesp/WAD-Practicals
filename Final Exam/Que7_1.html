<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBook Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f0f2f5;
        }

        .top-bar{
            background:rgb(57, 57, 146);
            color:white;
            padding: 10px;
        }

        .signup-box{
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="top-bar justify-content-between d-flex">
        <h2>Facebook</h2>

        <div class="d-flex">
            <input type="text" class="form-control me-2" placeholder="Email">
            <input type="password" class="form-control me-2" placeholder="Password">
            <button>Login</button>
        </div>
    </div>


    <div class="container mt-5">
        <div class="row">


            <div class="col-md-6">
                <h4>FaceBook is useless without friends</h4>
                <p>Make new friends</p>
                <img src="headphones.jpeg" width="90px" height="90px">
            </div>

            <div class="col-md-6">
                <div class="signup-box">
                    <h3>Create an Account</h3>
                    <p>It's Free and will always be</p>

                    <div class="row">
                        <div class="col">
                            <input class="form-control mb-2" type="text" placeholder="FirstName">
                        </div>
                        <div class="col">
                            <input type="text" class="form-control mb-2" placeholder="LastName">
                        </div>
                    </div>

                    <input type="text" class="form-control mb-2" placeholder="Email">
                    <input type="text" class="form-control mb-2" placeholder="Re-enter Email">
                    <input type="text" class="form-control mb-2" placeholder="Password">

                    <input type="date" class="form-control mb-2" >

                    <div class="mb-4">
                        <input type="radio"> Male
                        <input type="radio"> Female
                    </div>

                    <button class="btn btn-success w-100">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
