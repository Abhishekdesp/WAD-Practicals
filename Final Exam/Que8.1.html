<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container mb-5">
        <h3>Event Registration</h3>

        <form id="form">
            <div class="form-floating mb-5">
                <input type="text" class="form-control" placeholder="Name" required>
                <label>Full name</label>
                <div class="invalid-feedback">Enter Valid Name</div>
            </div>

            <div class="form-floating mb-5">
                <input type="text" class="form-control" placeholder="Name" required>
                <label>Email</label>
                <div class="invalid-feedback">Enter Email</div>
            </div>

            <div class="form-floating mb-5">
                <input type="text" class="form-control" placeholder="Name" required>
                <label>Phone Number</label>
                <div class="invalid-feedback">Enter Phone Number</div>
            </div>

            <div class="mb-5">
                <select class="form-select" data-bs-toggler="tooltip" title="Select Event" required>
                    <option>Choose</option>
                    <option>Workshop</option>
                    <option>Seminar</option>
                </select>
                <div class="invalid-feedback">Select Event</div>
            </div>

            <button class="btn btn-primary">Register</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('form').onsubmit=function(e){
            if(!this.checkValidity()){
                e.preventDefault();
                alert("Please Fill all fields correctly");
            }
        };

        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el=>new bootstrap.Tooltip(el));

    </script>
</body>
</html>
