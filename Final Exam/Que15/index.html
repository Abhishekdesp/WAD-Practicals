<!DOCTYPE html>
<html>
<body>

<h2>Product Catalog</h2>

<div id="products"></div>

<script>

fetch('http://localhost:3000/products')
.then(res => res.json())
.then(data => {

    let div = document.getElementById("products");

    data.forEach(p => {
        div.innerHTML += `
            <div style="border:1px solid black; margin:10px; padding:10px;">
                <img src="${p.image}"><br>
                <b>${p.name}</b><br>
                Price: ₹${p.price}
            </div>
        `;
    });

});

</script>

</body>
</html>
